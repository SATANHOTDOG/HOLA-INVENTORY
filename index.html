<!-- 🔥 同事防呆版：換檔精靈 Modal 🔥 -->

<script>
const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTC18jsseZH3TerLqZMzzkJc1uPjh2IVTktcs4DxiuEmpA_NRAnzKrgzZbV43FQtN8b7-vMlvv1BFGF/pub?gid=0&single=true&output=csv';
let products = [];
let currentFiltered = [];
let renderLimit = 100;

document.getElementById('wizardDate').valueAsDate = new Date();

async function fetchProducts() {
    try {
        const response = await fetch(GOOGLE_SHEET_CSV_URL);
        const csvText = await response.text();
        const lines = csvText.split('\n');
        
        let headers = [];
        if (lines.length > 0) {
            headers = parseCSVLine(lines[0]);
            const updateDate = headers[13];
            if (updateDate && updateDate.trim() !== '') {
                document.querySelector('.subtitle').innerText = `內部專用快速檢索系統 (最後更新：${updateDate.trim()})`;
            }
        }
        
        products = parseCSVOptimized(lines, headers);
        
        document.getElementById('loader').style.display = 'none';
        document.getElementById('searchInput').disabled = false;
        filterAndRender();
    } catch (error) {
        console.error('Fetch error:', error);
        document.getElementById('loader').innerText = '資料載入失敗，請確認 Google 試算表網址授權與發布設定。';
    }
}

function parseCSVOptimized(lines, headers) {
    const results = [];
    for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const values = parseCSVLine(lines[i]);
        let row = {};
        for (let j = 0; j < headers.length; j++) {
            if (headers[j]) {
                row[headers[j].trim()] = values[j] ? values[j].trim() : '';
            }
        }
        results.push(row);
    }
    return results;
}

function parseCSVLine(line) {
    let values = []; let current = ''; let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
        let char = line[i];
        if (char === '"' || char === "'") inQuotes = !inQuotes;
        else if (char === ',' && !inQuotes) { values.push(current); current = ''; }
        else current += char;
    }
    values.push(current);
    return values.map(v => v.replace(/^["']|["']$/g, ''));
}

// 價格解析核心
function getPriceAndPeriodOnDate(promoPriceStr, promoPeriodStr, targetDateObj) {
    if (!promoPriceStr || !promoPeriodStr) return { price: '', period: '' };
    const prices = promoPriceStr.split('|').map(s => s.trim());
    const periods = promoPeriodStr.split('|').map(s => s.trim());
    
    let bestPromo = null;
    let minDuration = Infinity;
    
    for (let i = 0; i < periods.length; i++) {
        const parts = periods[i].split('~');
        const priceMatch = prices[i] !== undefined ? prices[i] : prices[0];
        
        if (parts.length === 2) {
            const startStr = parts[0].trim().replace(/-/g, '/');
            const endStr = parts[1].trim().replace(/-/g, '/');
            const start = new Date(startStr + " 00:00:00");
            const end = new Date(endStr + " 23:59:59");
            
            if (targetDateObj >= start && targetDateObj <= end) {
                const duration = end - start;
                if (duration < minDuration) {
                    minDuration = duration;
                    bestPromo = { price: priceMatch, period: periods[i] };
                }
            }
        } else {
            if (Infinity <= minDuration) {
                bestPromo = { price: priceMatch, period: periods[i] };
            }
        }
    }
    return bestPromo || { price: '', period: '' };
}

function getActiveShortestPromo(promoPriceStr, promoPeriodStr) {
    return getPriceAndPeriodOnDate(promoPriceStr, promoPeriodStr, new Date());
}

function getRawPriceOnDate(p, targetDateObj) {
    const getVal = (key) => p[key] || p[` ${key}`] || p[`${key} `] || p[Object.keys(p).find(k => k.trim() === key)] || '';
    const origPriceStr = getVal('一般售價') || '0';
    const origPrice = parseInt(origPriceStr.replace(/,/g, '')) || 0;
    
    let rawPromoPrice = getVal('促銷售價');
    if(rawPromoPrice === '#N/A' || rawPromoPrice === '0') rawPromoPrice = '';
    let rawPromoPeriod = getVal('促銷期間');
    if(rawPromoPeriod === '#N/A') rawPromoPeriod = '';
    
    const promoData = getPriceAndPeriodOnDate(rawPromoPrice, rawPromoPeriod, targetDateObj);
    if (promoData.price !== '') {
        return parseInt(promoData.price.replace(/,/g, '')) || origPrice;
    }
    return origPrice;
}

// 🔥 換檔精靈：核心掃描器 🔥
function getWizardTargetSKUs(targetDateObj, prevDateObj) {
    let dropList = [];
    let riseList = [];
    
    const chkStock = document.getElementById('wizChkStock').checked;
    const chkShow = document.getElementById('wizChkShow').checked;
    
    if (!chkStock && !chkShow) return { drop: [], rise: [] };

    products.forEach(p => {
        const getVal = (key) => p[key] || p[` ${key}`] || p[`${key} `] || p[Object.keys(p).find(k => k.trim() === key)] || '';
        
        let targetQty = 0;
        if (chkStock) targetQty += parseInt(getVal('HOLA630庫存') || '0');
        if (chkShow) targetQty += parseInt(getVal('HOLA630展示') || '0');
        
        if (targetQty > 0) {
            const priceTarget = getRawPriceOnDate(p, targetDateObj);
            const pricePrev = getRawPriceOnDate(p, prevDateObj);
            const sku = getVal('SKU');
            
            if (priceTarget < pricePrev) {
                for (let i = 0; i < targetQty; i++) dropList.push(sku);
            } else if (priceTarget > pricePrev) {
                for (let i = 0; i < targetQty; i++) riseList.push(sku);
            }
        }
    });
    return { drop: dropList, rise: riseList };
}

// 🔥 防吃零、無引號的神奇 Excel 輸出器 🔥
function doExportExcel(skuList, typeName, dateStr) {
    if (!skuList || skuList.length === 0) return alert('這張清單是空的，去泡咖啡吧！');
    
    let htmlTable = `
        <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
        <head>
            <meta charset="utf-8">
            <style>
                td { mso-number-format:"\\@"; } 
            </style>
        </head>
        <body>
            <table>
                <tr><th>SKU</th></tr>
    `;
    
    skuList.forEach(sku => {
        htmlTable += `<tr><td>${sku}</td></tr>`;
    });
    
    htmlTable += `
            </table>
        </body>
        </html>
    `;
    
    const blob = new Blob([htmlTable], {type: "application/vnd.ms-excel;charset=utf-8;"});
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    
    link.setAttribute("href", url);
    link.setAttribute("download", `換檔POP_${dateStr}_${typeName}.xls`);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

// 5 日預警功能
function scanNext5Days() {
    const container = document.getElementById('wizard5DaysContainer');
    container.innerHTML = '<div style="text-align:center; color:#7f8c8d; padding: 10px;">魔法陣啟動，掃描未來中...</div>';
    
    setTimeout(() => {
        const today = new Date();
        today.setHours(12, 0, 0, 0);
        
        let foundAny = false;
        let html = '';
        
        for(let i = 0; i <= 5; i++) {
            const tDate = new Date(today.getTime() + i * 24 * 60 * 60 * 1000);
            const pDate = new Date(tDate.getTime() - 24 * 60 * 60 * 1000);
            
            const res = getWizardTargetSKUs(tDate, pDate);
            
            const month = String(tDate.getMonth()+1).padStart(2, '0');
            const day = String(tDate.getDate()).padStart(2, '0');
            const dateStr = `${tDate.getFullYear()}${month}${day}`;
            const displayDate = i === 0 ? "今天" : `${month}/${day}`;
            
            if (res.drop.length > 0) {
                foundAny = true;
                window[`wizData_drop_${dateStr}`] = res.drop;
                html += `
                <div class="wiz-date-row" style="background: #fadbd8;">
                    <span style="color: #c0392b; font-weight: bold;">${displayDate} 進入特價 (${res.drop.length} 張)</span>
                    <button class="btn" style="flex: 0 0 60px; background: #e74c3c; color: white; padding: 4px;" onclick="doExportExcel(window['wizData_drop_${dateStr}'], '進入特價', '${dateStr}')">匯出</button>
                </div>`;
            }
            if (res.rise.length > 0) {
                foundAny = true;
                window[`wizData_rise_${dateStr}`] = res.rise;
                html += `
                <div class="wiz-date-row" style="background: #d5f5e3;">
                    <span style="color: #27ae60; font-weight: bold;">${displayDate} 恢復原價 (${res.rise.length} 張)</span>
                    <button class="btn" style="flex: 0 0 60px; background: #27ae60; color: white; padding: 4px;" onclick="doExportExcel(window['wizData_rise_${dateStr}'], '恢復原價', '${dateStr}')">匯出</button>
                </div>`;
            }
        }
        
        if (!foundAny) {
            html = '<div style="text-align:center; color:#27ae60; font-weight:bold; padding: 10px;">🎉 未來 5 天無檔期異動，天下太平！</div>';
        }
        container.innerHTML = html;
    }, 10);
}

// 特定日期查詢功能
let currentSpecDrop = [];
let currentSpecRise = [];
let currentSpecDateStr = '';

function runWizardSpecific() {
    const dateInput = document.getElementById('wizardDate').value;
    if(!dateInput) return alert('請先選擇一個日期！');
    
    const safeDateStr = dateInput.replace(/-/g, '/'); 
    const targetDate = new Date(safeDateStr + " 12:00:00");
    const prevDate = new Date(targetDate.getTime() - 24 * 60 * 60 * 1000);
    
    const res = getWizardTargetSKUs(targetDate, prevDate);
    currentSpecDrop = res.drop;
    currentSpecRise = res.rise;
    currentSpecDateStr = dateInput.replace(/-/g, '');
    
    document.getElementById('btnDropSpec').innerText = `📥 匯出【進入特價】 (${res.drop.length} 張)`;
    document.getElementById('btnRiseSpec').innerText = `📥 匯出【恢復原價】 (${res.rise.length} 張)`;
    document.getElementById('wizardSpecificResult').style.display = 'block';
}

function exportSpecific(type) {
    if (type === 'drop') doExportExcel(currentSpecDrop, '進入特價', currentSpecDateStr);
    else doExportExcel(currentSpecRise, '恢復原價', currentSpecDateStr);
}

function openWizard() {

    document.getElementById('wizardModal').style.display='flex';
}

function filterAndRender() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const onlyYangmei = document.getElementById('stockFilter').checked;
    const onlyShop = document.getElementById('shopFilter').checked;
    const specialFilter = document.getElementById('specialFilter').value;
    
    currentFiltered = products.filter(p => {
        const getVal = (key) => p[key] || p[` ${key}`] || p[`${key} `] || p[Object.keys(p).find(k => k.trim() === key)] || '';
        const sku = getVal('SKU').toLowerCase();
        const name = getVal('商品名稱').toLowerCase();
        const ymStock = parseInt(getVal('楊梅庫存') || '0');
        const h630Stock = parseInt(getVal('HOLA630庫存') || '0');
        const h630Show = parseInt(getVal('HOLA630展示') || '0');
        const statusRaw = getVal('商品狀態') || '';
        
        const matchText = sku.includes(query) || name.includes(query);
        const matchYangmei = onlyYangmei ? (ymStock > 0) : true;
        
        let matchShop = onlyShop ? (h630Stock > 0 || h630Show > 0) : true;
        let passSpecial = true;
        
        // 特殊篩選霸王條款
        if (specialFilter === 'negative') {
            passSpecial = (h630Stock < 0 || h630Show < 0);
            matchShop = true; 
        } else if (specialFilter === 'stock_no_show') {
            passSpecial = (h630Stock > 0 && h630Show === 0 && !name.includes('毯'));
            matchShop = true;
        } else if (specialFilter === 'clearance') {
            passSpecial = (statusRaw.toUpperCase() === 'D' && (h630Stock > 0 || h630Show > 0));
            matchShop = true;
        }
        
        return matchText && matchYangmei && matchShop && passSpecial;
    });
    
    document.getElementById('dataCount').innerText = query || onlyYangmei || onlyShop || specialFilter
        ? `過濾結果：${currentFiltered.length} 筆` 
        : `共載入 ${products.length} 筆商品資料`;
        
    renderLimit = 100;
    renderProducts();
}

function renderProducts() {
    const container = document.getElementById('gridContainer');
    container.innerHTML = '';
    const listToRender = currentFiltered.slice(0, renderLimit);
    if (listToRender.length === 0) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #888; font-size: 1.2rem;">查無符合條件的商品，要不要叫客人直接買樣品走？</div>';
        return;
    }
    listToRender.forEach(p => {
        const getVal = (key) => p[key] || p[` ${key}`] || p[`${key} `] || p[Object.keys(p).find(k => k.trim() === key)] || '';
        const sku = getVal('SKU') || 'N/A';
        const name = getVal('商品名稱') || '無品名';
        const ymStock = parseInt(getVal('楊梅庫存') || '0');
        const h630Stock = parseInt(getVal('HOLA630庫存') || '0');
        const h630Show = parseInt(getVal('HOLA630展示') || '0');
        const origPrice = getVal('一般售價') || '0';
        
        let rawPromoPrice = getVal('促銷售價');
        if(rawPromoPrice === '#N/A' || rawPromoPrice === '0') rawPromoPrice = '';
        let rawPromoPeriod = getVal('促銷期間');
        if(rawPromoPeriod === '#N/A') rawPromoPeriod = '';
        
        const activePromo = getActiveShortestPromo(rawPromoPrice, rawPromoPeriod);
        const promoPrice = activePromo.price;
        const promoPeriod = activePromo.period;
        
        const category = getVal('商品分類') || '無分類';
        const vendor = getVal('廠商') || '';

        const statusRaw = getVal('商品狀態') || '';
        let statusHtml = '';
        if (statusRaw.toUpperCase() === 'D') {
            statusHtml = `<span style="color: #c0392b; font-weight: bold; background: #fadbd8; padding: 2px 6px; border-radius: 4px;">⚠️ 不續訂商品 (D)</span>`;
        } else if (statusRaw.toUpperCase() === 'A') {
            statusHtml = `<span style="color: #27ae60; font-weight: bold; background: #d5f5e3; padding: 2px 6px; border-radius: 4px;">✅ 正常品 (A)</span>`;
        } else if (statusRaw !== '') {
            statusHtml = `<span style="color: var(--text-muted);">${statusRaw}</span>`;
        }
        
        const pogRaw = getVal('POG');
        let pogHtml = '';
        if (pogRaw && pogRaw.trim() !== '') {
            pogHtml = `<span class="pog-tag pog-active">POG: 有POG</span>`;
        } else {
            pogHtml = `<span class="pog-tag pog-none">POG: 無</span>`;
        }

        const hasPhoto = Object.values(p).some(val => typeof val === 'string' && val.includes('有照片'));
        const photoBtnHtml = hasPhoto
            ? `<a href="https://satanhotdog.github.io/hola-furniture-search/?q=${sku}" target="_blank" class="btn btn-img">圖片</a>`
            : `<button class="btn btn-secondary" style="opacity: 0.6; cursor: not-allowed; background: #e0e0e0; color: #999;" disabled>💀 缺照片</button>`;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
        <div>
            <div class="card-header"><span class="sku-tag">SKU: ${sku}</span><div class="item-name">${name}</div></div>
            <div class="stock-section">
                <div class="stock-box"><span class="stock-title">楊梅庫存</span><span class="stock-val ${ymStock > 0 ? 'has-stock' : ''}">${ymStock}</span></div>
                <div class="stock-box"><span class="stock-title">HOLA630</span><span class="stock-val ${h630Stock > 0 ? 'has-stock' : (h630Stock < 0 ? 'negative-stock' : '')}">${h630Stock}</span></div>
                <div class="stock-box"><span class="stock-title">630展示</span><span class="stock-val ${h630Show > 0 ? 'has-stock' : (h630Show < 0 ? 'negative-stock' : '')}">${h630Show}</span></div>
            </div>
            <div class="price-section">
                <div class="price-row"><span class="price-label">一般售價</span><span class="${promoPrice ? 'price-orig' : 'price-promo'}">$${origPrice}</span></div>
                ${promoPrice ? `<div class="price-row"><span class="price-label">現在特價</span><span class="price-promo">$${promoPrice}</span></div>` : ''}
                ${promoPeriod ? `<div class="promo-period">⏱️ 最終檔期: ${promoPeriod}</div>` : ''}
            </div>
            <div class="info-row">
                <span>分類: ${category}</span>
                ${vendor ? `<span>廠商: ${vendor}</span>` : ''}
            </div>
            <div class="info-row">
                <span>狀態: ${statusHtml}</span>
                ${pogHtml} 
            </div>
        </div>
        <div class="action-btns">
            <a href="https://www.hola.com.tw/p/${sku}" target="_blank" class="btn btn-primary">官網</a>
            ${photoBtnHtml}
            <button class="btn btn-secondary" onclick="showQR('${sku}')">QR Code</button>
        </div>
        `;
        container.appendChild(card);
    });
    
    if (renderLimit < currentFiltered.length) {
        const btnDiv = document.createElement('div');
        btnDiv.style = "grid-column: 1/-1; text-align: center; padding: 10px;";
        const remaining = currentFiltered.length - renderLimit;
        btnDiv.innerHTML = `<button class="btn btn-secondary" style="width: 100%; padding: 15px; font-weight: bold; font-size: 1.1rem; border: 2px dashed #95a5a6; background: #eef2f7;" onclick="loadMore()">⬇️ 還有 ${remaining} 筆沒顯示，點我繼續往下挖</button>`;
        container.appendChild(btnDiv);
    }
}

function loadMore() { renderLimit += 100; renderProducts(); }
document.getElementById('searchInput').addEventListener('input', filterAndRender);
document.getElementById('stockFilter').addEventListener('change', filterAndRender);
document.getElementById('shopFilter').addEventListener('change', filterAndRender);
function showQR(sku) { document.getElementById('modalTitle').innerText = `${sku}`; document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://www.hola.com.tw/p/${sku}`; document.getElementById('qrModal').style.display = 'flex'; }
function closeModal() { document.getElementById('qrModal').style.display = 'none'; }
fetchProducts();

const html5QrCode = new Html5Qrcode("hiddenReader");
document.getElementById('cameraBtn').addEventListener('click', () => { document.getElementById('qrInput').click(); });
document.getElementById('qrInput').addEventListener('change', event => {
    if (event.target.files.length == 0) return;
    const file = event.target.files[0];
    const statusDiv = document.getElementById('scanStatus');
    statusDiv.style.display = 'block';
    
    html5QrCode.scanFile(file, true).then(decodedText => {
        statusDiv.style.display = 'none';
        let targetSku = null;
        const pMatch = decodedText.match(/\/p\/(0\d{8})/i);
        const rMatch = decodedText.match(/RPage=.*?(0\d{8})(?=\D|$)/i);
        const blindMatch = decodedText.match(/(0\d{8})(?=\D|$)/);
        
        if (pMatch && pMatch[1]) targetSku = pMatch[1];
        else if (rMatch && rMatch[1]) targetSku = rMatch[1];
        else if (blindMatch && blindMatch[1]) targetSku = blindMatch[1];
        
        if (targetSku) {
            let searchBox = document.getElementById('searchInput');
            searchBox.value = targetSku;
            searchBox.dispatchEvent(new Event('input'));
        } else {
            alert("掃描成功，但這不是 SKU！\n系統抓到的妖孽是：" + decodedText + "\n\n(可能是拍到旁邊的廠商出貨條碼，請針對網址 QR Code 重新拍一次)");
        }
    }).catch(err => {
        statusDiv.style.display = 'none';
        alert("解析失敗！照片可能太糊、反光，或是根本沒拍到 QR Code。請重新對焦再拍一次。");
    }).finally(() => { event.target.value = ''; });
});
</script>
